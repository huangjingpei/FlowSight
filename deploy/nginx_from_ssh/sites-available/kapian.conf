# WebSocket 支持的 map 配置
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream 配置：K8s Gateway NodePort
upstream kapian_gateway {
    server 124.221.179.44:30080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 兜底：拒绝一切未匹配域名/Host（禁止 IP 访问）
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name admin-kapian.1t90.com h5-kapian.1t90.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS 主站点（管理后台）
server {
    listen 443 ssl;
    server_name admin-kapian.1t90.com;

    # Gzip压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        image/svg+xml;
    gzip_disable "msie6";

    # SSL 证书配置
    ssl_certificate /etc/ssl/1t90.com/admin-kapian.1t90.com_bundle.pem;
    ssl_certificate_key /etc/ssl/1t90.com/admin-kapian.1t90.com.key;

    # SSL 安全配置 - 优化兼容性（启用 TLS1.3，并补充 CHACHA20 与更通用的椭圆曲线）
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS1.3 套件由 OpenSSL 默认管理，以下 cipher 作用于 TLS1.2（需写在一行）
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA;
        
    # 禁用HTTP/2，强制使用HTTP/1.1
    # http2_push_preload off;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
        
    # 添加兼容性配置
    ssl_buffer_size 4k;
    ssl_ecdh_curve X25519:secp256r1:secp384r1;
        
    # 添加调试信息
    error_log /var/log/nginx/ssl_error.log debug;
        
    # 添加 HSTS 头
    add_header Strict-Transport-Security "max-age=63072000" always;
        
    # 添加安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 静态资源配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /opt/kapian/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 前端静态文件
    location / {
        root /opt/kapian/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # H5 页面路径在主站做兼容跳转（建议直接使用 h5.kpsales.cn）
    location = /h5 { return 302 https://h5-kapian.1t90.com/; }
    location = /h5/ { return 302 https://h5-kapian.1t90.com/; }
    location = /h5.html { return 302 https://h5-kapian.1t90.com/; }

    # WebSocket 专用代理
    location /ws/ {
        proxy_pass http://kapian_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 长连接超时配置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # 禁用缓冲
        proxy_buffering off;
    }

    # API 代理配置（支持 WebSocket）
    location /api/ {
        # 允许上传最大 20MB 的文件
        client_max_body_size 20M;

        # 禁用缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
                
        # 代理设置（微服务架构：指向K8s Gateway NodePort）
        proxy_pass http://kapian_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass_request_headers on;
        
        # WebSocket 超时配置（保持长连接）
        proxy_connect_timeout 150;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        
        # WebSocket 缓冲配置
        proxy_buffering off;

        # 动态 CORS 头
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
                
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # MinIO 反向代理（将 /kapian-app/ 代理到 9000）

    # 防止 .html 被强缓存
    location ~* \.html$ {
        root /opt/kapian/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

# HTTPS H5 独立站（兼容nginx 1.24.0 + OpenSSL 3.0）
server {
    listen 443 ssl;
    server_name h5-kapian.1t90.com;

    # Gzip压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        image/svg+xml;
    gzip_disable "msie6";

    # 证书
    ssl_certificate /etc/ssl/1t90.com/h5-kapian.1t90.com_bundle.pem;
    ssl_certificate_key /etc/ssl/1t90.com/h5-kapian.1t90.com.key;
        
    # 证书链配置
    ssl_trusted_certificate /etc/ssl/1t90.com/h5-kapian.1t90.com_bundle.pem;
        
    # 强制使用完整的证书链
    ssl_verify_client off;
    ssl_verify_depth 3;

    # 使用nginx默认SSL配置（最兼容）
    # 移除所有自定义SSL配置，让nginx使用默认值
    # 使用nginx默认的SSL会话配置
        
    # 使用nginx默认的椭圆曲线配置（最兼容）
        
    # 移除可能影响兼容性的配置
    # ssl_early_data 和 ssl_stapling 使用nginx默认值
        
    # 添加更多调试信息
    error_log /var/log/nginx/ssl_error.log debug;

    # 调试日志与安全头保持一致
    error_log /var/log/nginx/ssl_error.log debug;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /opt/kapian/h5;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # H5 根路径（UniApp构建产物）
    location / {
        root /opt/kapian/h5;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # WebSocket 专用代理
    location /ws/ {
        proxy_pass http://kapian_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 长连接超时配置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # 禁用缓冲
        proxy_buffering off;
    }

    # API 代理（微服务架构：指向K8s Gateway NodePort，支持 WebSocket）
    location /api/ {
        # 允许上传最大 20MB 的文件
        client_max_body_size 20M;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        
        # 代理设置
        proxy_pass http://kapian_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass_request_headers on;
        
        # WebSocket 超时配置（保持长连接）
        proxy_connect_timeout 150;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        
        # WebSocket 缓冲配置
        proxy_buffering off;

        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # MinIO 反向代理（将 /kapian-app/ 代理到 9000）

    # 防止 .html 被强缓存
    location ~* \.html$ {
        root /opt/kapian/h5;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}