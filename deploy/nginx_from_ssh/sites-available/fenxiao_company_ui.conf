server {
    listen 80;
    server_name 124.221.179.44 www.1t90.com 1t90.com;
    return 301 https://www.1t90.com$request_uri;
}
 
server {
    listen 443 ssl;
    server_name www.1t90.com;
 
    ssl_certificate /etc/ssl/1t90.com/www.1t90.com_bundle.pem;
    ssl_certificate_key /etc/ssl/1t90.com/www.1t90.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
 
    root /opt/fenxiao_com_ui/html;
    index index.html;
 
    location /api/ {
        proxy_pass http://127.0.0.1:28080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images proxy to MinIO
    location ^~ /images/ {
        proxy_pass http://124.221.179.44:9000/fenxiao-app-dev/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Company website proxy to MinIO
    location ^~ /company-website/ {
        proxy_pass http://124.221.179.44:9000/fenxiao-app-dev/company-website/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
 
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}