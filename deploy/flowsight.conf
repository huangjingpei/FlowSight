# ========================================================
# FlowSight 边云协同智能物联与视觉分析平台 Nginx 路由配置
# 域名: flowsight.1t90.com
# 端口: 80 / 443 (HTTPS) / 3000 (H5) / 3001 (Admin) / 8888 (网关)
# ========================================================

# 1. 域名 HTTP 强制跳转 HTTPS (同时开放 Let's Encrypt 挑战路径)
server {
    listen 80;
    server_name flowsight.1t90.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# 2. 域名 HTTPS 主站点 (flowsight.1t90.com)
server {
    listen 443 ssl;
    server_name flowsight.1t90.com;

    # SSL 证书与密钥
    ssl_certificate /etc/ssl/1t90.com/flowsight.1t90.com_bundle.pem;
    ssl_certificate_key /etc/ssl/1t90.com/flowsight.1t90.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:FlowSightSSL:20m;
    ssl_session_timeout 1d;

    # Gzip 压缩加速
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # PC 管理运营端直达
    location /admin {
        alias /opt/flowsight/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # 移动端 H5 决策与数字大屏
    location / {
        root /opt/flowsight/h5;
        try_files $uri $uri/ /index.html;
    }

    # 云端 Java 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 抓拍现场短切片视频流回放
    location /clips/ {
        alias /opt/flowsight/clips/;
        expires 7d;
        add_header Access-Control-Allow-Origin *;
    }
}

# 3. 独立端口: 移动端 H5 决策大屏与数字大屏 (Port 3000)
server {
    listen 3000;
    server_name _;

    root /opt/flowsight/h5;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /clips/ {
        alias /opt/flowsight/clips/;
        expires 7d;
        add_header Access-Control-Allow-Origin *;
    }
}

# 4. 独立端口: PC 管理运营中台 (Port 3001)
