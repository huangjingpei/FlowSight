# 5. 独立端口: 统一聚合调度中枢 (Port 8888)
server {
    listen 8888;
    server_name _;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /admin {
        alias /opt/flowsight/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
