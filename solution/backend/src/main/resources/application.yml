server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: flowsight-cloud-backend
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:flowsight_cloud}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:89dfu*#$ewr87l}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # 数据库生产保护：严禁在每次启动或部署时执行脚本，确保既有数据绝对持久化
  sql:
    init:
      mode: never


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 采用 SLF4J 统一日志通道，替代无条件 StdOutImpl 控制台强刷，杜绝控制台 I/O 阻塞
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:flowsight_admin}
  secret-key: ${MINIO_SECRET_KEY:FlowSightMinio123!}
  bucket-name: ${MINIO_BUCKET:flowsight-clips}

jwt:
  # Base64 encoded 256-bit key
  secret: c29tZXZlcnlzZWNyZXRrZXlmb3JmbG93c2lnaHRhdXRoZW50aWNhdGlvbjEyMzQ1Ng==
  expire-hours: 72

logging:
  level:
    root: INFO
    com.flowsight.cloud: INFO
    com.flowsight.cloud.mapper: WARN
